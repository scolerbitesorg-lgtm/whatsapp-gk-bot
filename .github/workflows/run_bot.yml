name: Daily WhatsApp Poll Automation

on:
  schedule:
    # 03:30 UTC ka matlab Indian Standard Time (IST) ke subah 09:00 AM hota hai
    - cron: '30 3 * * *'
  workflow_dispatch: # Isse aap manually bhi jab chahein button daba kar chala sakte hain

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Copy Code From Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google AI & Request Tools
      run: |
        pip install -r requirements.txt

    - name: Execute Bot Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
        GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bot.py
